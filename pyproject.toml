[project]
name = "argos"
version = "0.1.0"
description = "Argos — Modular RAG system for multimodal document ingestion, semantic search, and encrypted storage"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "dOuReallyDo"}
]
keywords = ["rag", "embeddings", "semantic-search", "multimodal", "pdf-parsing", "encryption"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "qdrant-client>=1.13.0",
    "sentence-transformers>=3.3.0",
    "chromadb>=0.5.0",
    "Pillow>=11.0.0",
    "pypdfium2>=4.30.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "markitdown>=0.0.1",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "easyocr>=1.7.0",
    "pytesseract>=0.3.0",
    "ffmpeg-python>=0.2.0",
    "openai-whisper>=20240930",
    "cryptography>=44.0.0",
    "argon2-cffi>=23.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "boto3>=1.36.0",
    "minio>=7.2.0",
    "aiofiles>=24.1.0",
    "click>=8.1.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "coverage>=7.6.0",
]

gpu = [
    "torch>=2.5.0",
    "transformers>=4.47.0",
    "accelerate>=1.3.0",
]

glm-ocr = [
    "glm-ocr>=0.1.0",
]

google-embeddings = [
    "google-genai>=1.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=argos --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.hatch.build.targets.wheel]
packages = ["core", "ingestion", "embeddings", "storage", "encryption", "api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
