# Production docker-compose — includes API and Celery worker
version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: argos-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - ARGOS_ENV=production
    env_file:
      - ../.env
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - argos_data:/app/data
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: argos-worker
    command: celery -A api.tasks worker --loglevel=info --concurrency=4
    environment:
      - ARGOS_ENV=production
    env_file:
      - ../.env
    depends_on:
      - redis
      - qdrant
    volumes:
      - argos_data:/app/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: argos-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: argos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: argos-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  argos_data:
  qdrant_data:
  redis_data:
  minio_data:
