<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Argos RAG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#4263eb;--primary-light:#dbe4ff;--green:#2f9e44;--red:#e03131;--gray-50:#f8f9fa;--gray-100:#f1f3f5;--gray-200:#e9ecef;--gray-300:#dee2e6;--gray-400:#adb5bd;--gray-500:#868e96;--gray-600:#495057;--gray-700:#343a40;--gray-800:#212529;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--gray-50);color:var(--gray-800);min-height:100vh}
nav{background:#fff;border-bottom:1px solid var(--gray-200);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
nav .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
nav .badge{font-size:9px;background:var(--primary-light);color:var(--primary);padding:2px 6px;border-radius:99px;font-weight:600;text-transform:uppercase}
nav .user{font-size:11px;color:var(--gray-500)}
main{max-width:680px;margin:0 auto;padding:16px}
.page{display:none}
.page.active{display:block}
.card{background:#fff;border-radius:var(--radius);border:1px solid var(--gray-200);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:15px;font-weight:600;margin-bottom:10px}
input,select{width:100%;padding:10px 14px;border:1.5px solid var(--gray-300);border-radius:8px;font-size:14px;outline:none}
input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(66,99,235,.12)}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:#364fc7}
.btn-secondary{background:var(--gray-100);color:var(--gray-700)}
.btn-secondary:hover{background:var(--gray-200)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn:disabled{opacity:.5;pointer-events:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gap{margin-top:10px}
.dropzone{border:2px dashed var(--gray-300);border-radius:var(--radius);padding:28px 12px;text-align:center;cursor:pointer;transition:all .2s;background:var(--gray-50)}
.dropzone.drag{border-color:var(--primary);background:var(--primary-light)}
.dropzone p{color:var(--gray-500);font-size:13px;margin:2px 0}
.file-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--gray-50);border-radius:8px;margin-top:6px}
.file-item .name{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item .size{font-size:11px;color:var(--gray-500)}
.file-item .remove{background:none;border:none;color:var(--gray-400);cursor:pointer;font-size:16px;padding:2px 6px}
.status{display:flex;align-items:center;gap:6px;font-size:13px;padding:8px 10px;border-radius:8px;margin-top:8px}
.ok{background:#ebfbee;color:#2b8a3e}
.err{background:#fff5f5;color:#c92a2a}
.empty{text-align:center;padding:32px 16px;color:var(--gray-400);font-size:13px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;padding:12px;font-size:10px;color:var(--gray-400);border-top:1px solid var(--gray-200);margin-top:24px}
</style>
</head>
<body>

<nav>
<div class="logo">
<svg viewBox="0 0 32 32" fill="none" style="width:24px;height:24px"><circle cx="16" cy="16" r="14" stroke="#4263eb" stroke-width="2"/><path d="M10 20l3-6 3 4 3-8 3 10" stroke="#4263eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="4" r="2" fill="#4263eb"/></svg>
Argos <span class="badge">RAG</span>
</div>
<div class="user" id="header-email"></div>
</nav>

<main>
<!-- UPLOAD -->
<div class="page active" id="page-upload">
<div class="card">
<h2>📤 Upload Documenti</h2>
<div class="row" style="margin-bottom:10px">
<input type="email" id="source-email" placeholder="La tua email..." value="morphblue91@gmail.com" style="flex:1">
</div>
<div class="dropzone" id="dropzone">
<p>📁 Trascina file qui o clicca per selezionare</p>
<p style="font-size:11px">PDF · Word · Excel · PPT · TXT · MD · JPG · PNG · MP3 · MP4 · WAV · MOV...</p>
</div>
<input type="file" id="file-input" multiple style="display:none">
<div id="file-list"></div>
<div class="gap row">
<button class="btn btn-primary" id="upload-btn" disabled onclick="uploadAll()">📤 Carica</button>
<button class="btn btn-secondary btn-sm" onclick="clearFiles()">Svuota</button>
</div>
<div id="upload-status"></div>
</div>
</div>

<!-- SEARCH -->
<div class="page" id="page-search">
<div class="card">
<h2>🔍 Ricerca</h2>
<div class="row" style="margin-bottom:8px">
<select id="search-source" style="flex:1" onchange="doSearch()">
<option value="">— Tutte le fonti —</option>
</select>
</div>
<input type="text" id="search-query" placeholder="Cerca documenti..." onkeydown="if(event.key==='Enter')doSearch()">
<div class="row gap">
<button class="btn btn-primary" onclick="doSearch()">Cerca</button>
<label style="font-size:12px"><input type="checkbox" id="search-semantic"> Ricerca semantica</label>
</div>
</div>
<div id="search-results"></div>
</div>
</main>

<div class="footer">
<a href="#" onclick="switchPage('upload')" style="color:var(--primary)">📤 Upload</a> &nbsp;·&nbsp;
<a href="#" onclick="switchPage('search')" style="color:var(--primary)">🔍 Cerca</a> &nbsp;·&nbsp;
Argos v0.1.0 &nbsp;·&nbsp; AES-256-GCM
</div>

<script>
let files = [];

// Init
document.addEventListener('DOMContentLoaded', () => {
  // Dropzone
  const dz = document.getElementById('dropzone');
  dz.addEventListener('click', () => document.getElementById('file-input').click());
  ['dragenter','dragover','dragleave','drop'].forEach(e => dz.addEventListener(e, ev => ev.preventDefault()));
  dz.addEventListener('dragover', () => dz.classList.add('drag'));
  dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
  dz.addEventListener('drop', e => { dz.classList.remove('drag'); addFiles(e.dataTransfer.files); });

  document.getElementById('file-input').addEventListener('change', e => addFiles(e.target.files));
  document.getElementById('header-email').textContent = document.getElementById('source-email').value;

  // Load sources for search dropdown
  loadSourceDropdown();
});

function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  if (name === 'search') loadSourceDropdown();
}

// ── File handling ──
function addFiles(newFiles) {
  for (const f of newFiles) files.push(f);
  renderFiles();
}

function removeFile(i) { files.splice(i,1); renderFiles(); }
function clearFiles() { files = []; renderFiles(); }

function renderFiles() {
  const list = document.getElementById('file-list');
  if (!files.length) { list.innerHTML = ''; document.getElementById('upload-btn').disabled = true; return; }
  list.innerHTML = files.map((f,i) => `<div class="file-item">
    <span class="name">📄 ${f.name}</span>
    <span class="size">${fmtSize(f.size)}</span>
    <button class="remove" onclick="removeFile(${i})">✕</button>
  </div>`).join('');
  document.getElementById('upload-btn').disabled = false;
}

function fmtSize(b) {
  if (b<1024) return b+'B';
  if (b<1048576) return (b/1024).toFixed(1)+'KB';
  return (b/1048576).toFixed(1)+'MB';
}

// ── Upload ──
async function uploadAll() {
  const email = document.getElementById('source-email').value.trim();
  if (!email) return alert('Inserisci un\'email');
  if (!files.length) return;

  const btn = document.getElementById('upload-btn');
  const statusDiv = document.getElementById('upload-status');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Caricamento...';
  statusDiv.innerHTML = '';
  document.getElementById('header-email').textContent = email;

  for (const file of files) {
    const form = new FormData();
    form.append('file', file);
    form.append('source_id', email);

    try {
      const r = await fetch('/api/documents/upload', { method:'POST', body: form });
      const data = await r.json();
      if (r.ok) {
        statusDiv.innerHTML += `<div class="status ok">✅ ${file.name}: ${data.message||'OK'} (doc:${data.document_id?.slice(0,8)||'?'})</div>`;
      } else {
        statusDiv.innerHTML += `<div class="status err">❌ ${file.name}: ${data.detail||data.message||r.status+' '+r.statusText}</div>`;
      }
    } catch(e) {
      statusDiv.innerHTML += `<div class="status err">❌ ${file.name}: ${e.message}</div>`;
    }
  }

  files = [];
  renderFiles();
  btn.innerHTML = '📤 Carica';
  loadSourceDropdown(); // Refresh search sources
}

// ── Search ──
async function loadSourceDropdown() {
  try {
    const r = await fetch('/api/sources');
    const sources = await r.json();
    const sel = document.getElementById('search-source');
    sel.innerHTML = '<option value="">— Tutte le fonti —</option>' +
      sources.map(s => `<option value="${s.id}">${s.source_value} (${s.source_type})</option>`).join('');
  } catch(e) { /* ignore */ }
}

async function doSearch() {
  const query = document.getElementById('search-query').value.trim();
  if (!query) return;

  const semantic = document.getElementById('search-semantic').checked;
  const sourceId = document.getElementById('search-source').value;
  const div = document.getElementById('search-results');
  div.innerHTML = '<div class="empty"><span class="spinner" style="border-color:var(--gray-400);border-top-color:transparent"></span> Ricerca...</div>';

  try {
    let r;
    if (semantic) {
      r = await fetch('/api/search', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({query, top_k:20, source_id: sourceId||undefined})
      });
    } else {
      // Simple: search by filename in DB
      const params = new URLSearchParams({query, limit:'50'});
      r = await fetch('/api/sources');
      const sources = await r.json();
      const targetSourceId = sourceId || sources[0]?.id || '';
      if (targetSourceId) {
        // Search within source
        r = await fetch(`/api/documents/by-source/${targetSourceId}`);
        const docs = await r.json();
        const qLower = query.toLowerCase();
        const matches = docs.filter(d => d.original_filename?.toLowerCase().includes(qLower));
        if (matches.length) {
          div.innerHTML = `<p style="font-size:12px;color:var(--gray-500);margin:8px 0">${matches.length} risultati (ricerca per filename)</p>` +
            matches.map(d => `<div class="card" style="margin-bottom:8px;padding:12px">
              <div style="font-size:13px;font-weight:500">📄 ${d.original_filename}</div>
              <div style="font-size:11px;color:var(--gray-500);display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
                <span>${d.document_type}</span> · <span>${fmtSize(d.file_size_bytes)}</span> · <span>${d.status}</span> · <span>${new Date(d.created_at).toLocaleDateString()}</span>
              </div>
            </div>`).join('');
        } else {
          div.innerHTML = '<div class="empty">🔍 Nessun documento trovato</div>';
        }
        return;
      }
      div.innerHTML = '<div class="empty">🔍 Registra una fonte prima di cercare</div>';
      return;
    }

    // Semantic results
    const data = await r.json();
    if (!data.results?.length) {
      div.innerHTML = '<div class="empty">🔍 Nessun risultato</div>';
      return;
    }
    div.innerHTML = `<p style="font-size:11px;color:var(--gray-500);margin:8px 0">${data.total_results} risultati · ${data.took_ms?.toFixed(1)||0}ms</p>` +
      data.results.map(r => `<div class="card" style="margin-bottom:8px;padding:12px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;flex-wrap:wrap;gap:4px">
          <span style="font-size:13px;font-weight:500">📄 ${r.original_filename||'?'}</span>
          <span style="font-size:11px;color:var(--gray-400)">${((r.score||0)*100).toFixed(0)}%</span>
        </div>
        <div style="font-size:13px;color:var(--gray-600);line-height:1.4">${r.text?.slice(0,250)||''}</div>
        <div style="font-size:10px;color:var(--gray-400);margin-top:4px">${r.document_type||''} · chunk #${r.chunk_index||0}</div>
      </div>`).join('');
  } catch(e) {
    div.innerHTML = `<div class="status err">❌ Errore: ${e.message}</div>`;
  }
}
</script>
</body>
</html>
