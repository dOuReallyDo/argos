name: Make GHCR Packages Public

on:
  workflow_dispatch:

jobs:
  make-public:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Make argos package public
        run: |
          echo "=== Verify image exists ==="
          echo "${{ github.token }}" | docker login ghcr.io -u doureallydo --password-stdin
          docker pull ghcr.io/doureallydo/argos:latest 2>&1 || echo "Pull failed"
          
          echo "=== Try GraphQL mutation ==="
          gh api graphql -f query='
            mutation {
              updatePackage(input: {packageId: "", visibility: PUBLIC}) {
                package { name visibility }
              }
            }
          ' 2>&1 || echo "graphql mutation failed"
          
          echo "=== List all container packages ==="
          curl -s -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages?package_type=container&visibility=private" 2>&1
          
          echo "=== Try with org: doureallydo ==="
          curl -s -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/doureallydo/packages?package_type=container" 2>&1
          
          echo ""
          echo "⚠️ If API doesn't work, make public manually:"
          echo "   https://github.com/doureallydo?tab=packages → argos → Settings → Danger Zone → Change visibility → Public"
